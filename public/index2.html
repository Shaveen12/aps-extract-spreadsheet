<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autodesk Platform Services: Export Spreadsheet</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
  <link rel="stylesheet" href="css/main.css">

  <!-- jQuery for DOM manipulation -->
  <script src="js/libraries/jquery.min.js"></script>

  <!-- Notification balloons -->
  <script src="js/libraries/notify.min.js"></script>

  <!-- Autodesk Platform Services Viewer files -->
  <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" type="text/css">
  <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/viewer.js"></script>

  <!-- XLS related libraries -->
  <script src="js/libraries/Blob.js"></script> <!-- https://github.com/eligrey/Blob.js -->
  <script src="js/libraries/FileSaver.min.js"></script> <!-- https://github.com/eligrey/FileSaver.js -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.mini.min.js" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/shim.min.js" integrity="sha512-nPnkC29R0sikt0ieZaAkk28Ib7Y1Dz7IqePgELH30NnSi1DzG4x+envJAOHz8ZSAveLXAHTR3ai2E9DZUsT8pQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/ExportXLS.js"></script>

  <!-- Basic script for this page -->
  <script>
    // Global variable to store the URN input by the user
    var sampleURN;
    
    $(document).ready(function () {
      // Bind the "Load Model" button to retrieve the URN from the input field
      $('#loadModel').click(function(){
          var userUrn = $('#inputUrn').val().trim();
          if (userUrn === '') {
              $.notify("Please enter a URN", 'warn');
              return;
          }
          sampleURN = userUrn;
          // Display the model using the provided URN (this call assumes your showModel function exists)
          showModel(sampleURN);
      });
      
      // Bind the "Export to Excel" button to trigger XLS export
      $('#downloadExcel').click(downloadExcel);
    });

    // Function to prepare and download the XLS file using the user-provided URN
    function downloadExcel() {
      if (!sampleURN) {
         $.notify("No URN loaded. Please load a URN first.", "warn");
         return;
      }
      $('#downloadExcel').prop("disabled", true);
      getAccessToken(function (access_token, expires_in) {
        ExportXLS.downloadXLSX(sampleURN, access_token, statusCallback);
      });
    }

    // Callback to update export status
    function statusCallback(completed, message) {
      $.notify(message, 'info');
      $('#downloadExcel').prop("disabled", !completed);
    }

    // Function to get an access token (replace with your own token endpoint as needed)
    function getAccessToken(callback) {
      jQuery.ajax({
        url: 'api/auth/token',
        success: function (oauth) {
          if (callback)
            callback(oauth.access_token, oauth.expires_in);
        }
      });
    }
  </script>
</head>
<body>
  <div id="top">
    <div>
      <label for="inputUrn">Enter URN:</label>
      <input type="text" id="inputUrn" placeholder="Paste your URN here">
      <button id="loadModel">Load Model</button>
    </div>
    <div>
      <button id="downloadExcel">Export to Excel</button>
    </div>
  </div>
  <div id="viewer"></div>
</body>
</html>
